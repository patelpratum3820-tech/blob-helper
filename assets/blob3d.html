<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blob 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      outline: none;
    }
  </style>
  <script src="three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    // --- 3D Scene Initialization ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 6.2;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false;
    container.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(4, 5, 5);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xd0bfff, 0.8);
    rimLight.position.set(-4, -2, -3);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0xffffff, 0.6);
    fillLight.position.set(0, 0, 4);
    scene.add(fillLight);

    // --- Color Themes per Emotion ---
    const EMOTION_COLORS = {
      idle:      { body: 0xc4b5fd, rim: 0xa78bfa, light: 0xddd6fe }, // Soft Lilac
      thinking:  { body: 0xfcd34d, rim: 0xfbbf24, light: 0xfef08a }, // Golden Amber
      happy:     { body: 0xf472b6, rim: 0xec4899, light: 0xfbcfe8 }, // Warm Rosy Pink
      typing:    { body: 0x38bdf8, rim: 0x0284c7, light: 0xbae6fd }, // Cyan Blue
      surprised: { body: 0x34d399, rim: 0x059669, light: 0xa7f3d0 }  // Fresh Mint
    };

    let currentEmotion = "idle";
    let targetColor = new THREE.Color(EMOTION_COLORS.idle.body);
    let currentColor = new THREE.Color(EMOTION_COLORS.idle.body);

    // --- Procedural 3D Blob Mesh ---
    const sphereGeo = new THREE.SphereGeometry(1.45, 48, 48);
    // Cache original vertex positions for shader-like deformation
    const basePositions = sphereGeo.attributes.position.array.slice();

    const bodyMaterial = new THREE.MeshPhysicalMaterial({
      color: currentColor,
      roughness: 0.18,
      metalness: 0.05,
      clearcoat: 0.7,
      clearcoatRoughness: 0.15,
      transmission: 0.1,
      reflectivity: 0.9
    });

    const blobMesh = new THREE.Mesh(sphereGeo, bodyMaterial);
    scene.add(blobMesh);

    // --- Eyes Rig ---
    const eyeGroup = new THREE.Group();
    scene.add(eyeGroup);

    const eyeGeo = new THREE.SphereGeometry(0.24, 24, 24);
    const pupilGeo = new THREE.SphereGeometry(0.12, 20, 20);
    const glintGeo = new THREE.SphereGeometry(0.045, 12, 12);

    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x1e1b4b });
    const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    function createEye(xOffset) {
      const eyePivot = new THREE.Group();
      eyePivot.position.set(xOffset, 0.22, 1.25);

      const white = new THREE.Mesh(eyeGeo, eyeMat);
      eyePivot.add(white);

      const pupil = new THREE.Mesh(pupilGeo, pupilMat);
      pupil.position.set(0, 0, 0.16);
      eyePivot.add(pupil);

      const glint = new THREE.Mesh(glintGeo, glintMat);
      glint.position.set(0.04, 0.04, 0.25);
      eyePivot.add(glint);

      eyeGroup.add(eyePivot);
      return { pivot: eyePivot, white, pupil, glint };
    }

    const leftEye = createEye(-0.48);
    const rightEye = createEye(0.48);

    // --- Blush Cheeks ---
    const blushGeo = new THREE.SphereGeometry(0.16, 16, 16);
    blushGeo.scale(1.2, 0.6, 0.4);
    const blushMat = new THREE.MeshBasicMaterial({ color: 0xfb7185, transparent: true, opacity: 0.55 });

    const leftBlush = new THREE.Mesh(blushGeo, blushMat);
    leftBlush.position.set(-0.72, -0.05, 1.22);
    scene.add(leftBlush);

    const rightBlush = new THREE.Mesh(blushGeo, blushMat);
    rightBlush.position.set(0.72, -0.05, 1.22);
    scene.add(rightBlush);

    // --- 3D Mouth Curve ---
    const mouthCurve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(-0.20, -0.25, 1.34),
      new THREE.Vector3(0, -0.42, 1.38),
      new THREE.Vector3(0.20, -0.25, 1.34)
    );
    const mouthGeo = new THREE.TubeGeometry(mouthCurve, 16, 0.04, 8, false);
    const mouthMat = new THREE.MeshBasicMaterial({ color: 0x1e1b4b });
    const mouthMesh = new THREE.Mesh(mouthGeo, mouthMat);
    scene.add(mouthMesh);

    // --- Noise & Wobble Math Helpers ---
    function pseudoNoise(x, y, z, t) {
      return (
        Math.sin(x * 2.2 + t * 2.0) * 0.35 +
        Math.sin(y * 2.5 + t * 2.3) * 0.35 +
        Math.sin(z * 2.1 + t * 1.8) * 0.30
      );
    }

    // --- State Variables ---
    let time = 0;
    let blinkTimer = 0;
    let isBlinking = false;
    let eyeBlinkScale = 1.0;
    let mouseX = 0;
    let mouseY = 0;
    let targetMouseX = 0;
    let targetMouseY = 0;
    let impulseWobble = 0.0;

    // --- External Interface Called by Python ---
    window.setEmotion = function(emotion) {
      currentEmotion = emotion || "idle";
      const config = EMOTION_COLORS[currentEmotion] || EMOTION_COLORS.idle;
      targetColor.setHex(config.body);
      impulseWobble = 0.35; // Trigger bounce on emotion shift
    };

    window.setMousePos = function(normalizedX, normalizedY) {
      targetMouseX = (normalizedX - 0.5) * 2;
      targetMouseY = -(normalizedY - 0.5) * 2;
    };

    window.triggerJiggle = function(strength) {
      impulseWobble = Math.min(1.0, (impulseWobble || 0) + (strength || 0.4));
    };

    // --- Animation Loop ---
    function animate() {
      requestAnimationFrame(animate);
      time += 0.024;

      // Color transition
      currentColor.lerp(targetColor, 0.08);
      bodyMaterial.color.copy(currentColor);

      // Damp impulse wobble
      impulseWobble *= 0.94;

      // Mouse tracking interpolation
      mouseX += (targetMouseX - mouseX) * 0.1;
      mouseY += (targetMouseY - mouseY) * 0.1;

      // --- Deform Body Vertices (Organic Jelly Physics) ---
      const positions = sphereGeo.attributes.position.array;
      const wobbleFreq = currentEmotion === "thinking" ? 3.5 : (currentEmotion === "happy" ? 4.0 : 2.0);
      const wobbleAmp = 0.07 + impulseWobble * 0.14 + (currentEmotion === "thinking" ? 0.05 : 0.02);

      // Vertical Squash & Stretch factor
      let squashY = 1.0;
      let squashXZ = 1.0;
      if (currentEmotion === "happy") {
        squashY = 1.0 + Math.sin(time * 6.0) * 0.12;
        squashXZ = 1.0 - Math.sin(time * 6.0) * 0.06;
      } else if (currentEmotion === "thinking") {
        squashY = 1.05 + Math.sin(time * 2.0) * 0.04;
        squashXZ = 0.96;
      } else if (currentEmotion === "surprised") {
        squashY = 1.15;
        squashXZ = 0.90;
      }

      for (let i = 0; i < positions.length; i += 3) {
        const bx = basePositions[i];
        const by = basePositions[i + 1];
        const bz = basePositions[i + 2];

        const noise = pseudoNoise(bx, by, bz, time * wobbleFreq);
        const disp = 1.0 + noise * wobbleAmp;

        positions[i]     = bx * disp * squashXZ;
        positions[i + 1] = by * disp * squashY;
        positions[i + 2] = bz * disp * squashXZ;
      }
      sphereGeo.attributes.position.needsUpdate = true;
      sphereGeo.computeVertexNormals();

      // --- Floating & Idle Body Rotation ---
      const idleFloatY = Math.sin(time * 1.8) * 0.08;
      blobMesh.position.y = idleFloatY;
      blobMesh.rotation.y = Math.sin(time * 0.8) * 0.08 + mouseX * 0.15;
      blobMesh.rotation.x = -mouseY * 0.12;

      // --- Natural Eye Blinking ---
      blinkTimer += 1;
      if (blinkTimer > 130) {
        if (Math.random() < 0.04) {
          isBlinking = true;
          blinkTimer = 0;
        }
      }
      if (isBlinking) {
        eyeBlinkScale = THREE.MathUtils.lerp(eyeBlinkScale, 0.05, 0.4);
        if (eyeBlinkScale < 0.08) isBlinking = false;
      } else {
        eyeBlinkScale = THREE.MathUtils.lerp(eyeBlinkScale, 1.0, 0.25);
      }

      // Eye look direction
      let lookX = mouseX * 0.25;
      let lookY = mouseY * 0.22;
      if (currentEmotion === "thinking") {
        lookX = 0.22;
        lookY = 0.28; // Look up thoughtfully
      } else if (currentEmotion === "typing") {
        lookX = 0.0;
        lookY = -0.22; // Look down at work
      }

      leftEye.pivot.scale.y = eyeBlinkScale;
      rightEye.pivot.scale.y = eyeBlinkScale;
      leftEye.pivot.position.y = (0.22 + idleFloatY) * squashY;
      rightEye.pivot.position.y = (0.22 + idleFloatY) * squashY;

      leftEye.pupil.position.x = lookX * 0.08;
      leftEye.pupil.position.y = lookY * 0.08;
      rightEye.pupil.position.x = lookX * 0.08;
      rightEye.pupil.position.y = lookY * 0.08;

      // Blush sync
      leftBlush.position.y = (-0.05 + idleFloatY) * squashY;
      rightBlush.position.y = (-0.05 + idleFloatY) * squashY;

      // Mouth position sync
      mouthMesh.position.y = idleFloatY * squashY;
      if (currentEmotion === "surprised") {
        mouthMesh.scale.set(0.6, 1.6, 1.0);
      } else if (currentEmotion === "happy") {
        mouthMesh.scale.set(1.2, 1.3, 1.0);
      } else {
        mouthMesh.scale.set(1.0, 1.0, 1.0);
      }

      renderer.render(scene, camera);
    }

    // Window Resize Handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
