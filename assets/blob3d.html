<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Remorus AI — Minimalist Floating Jelly Sphere</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
    }
    canvas {
      display: block;
      outline: none;
    }
    /* Minimalist Floating HUD Pill for Remorus Status */
    .remorus-pill {
      position: absolute;
      bottom: 6px;
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(10, 15, 29, 0.85);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px) scale(0.95);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .remorus-pill.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .remorus-pill.listening {
      color: #00f5ff;
      border-color: rgba(0, 245, 255, 0.7);
      box-shadow: 0 0 16px rgba(0, 245, 255, 0.35);
    }
    .remorus-pill.thinking {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.7);
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.35);
    }
  </style>
  <script src="three.min.js"></script>
</head>
<body>
  <div id="canvas-container">
    <div id="remorus-pill" class="remorus-pill">Remorus Active</div>
  </div>

  <script>
    // =========================================================================
    // 1. SCENE & HIGH-PERFORMANCE RENDERER
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const remorusPill = document.getElementById('remorus-pill');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 5.2);

    const renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    container.appendChild(renderer.domElement);

    // =========================================================================
    // 2. STUDIO REFRACTION LIGHTING
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(4, 5, 4);
    scene.add(keyLight);

    const cyanRim = new THREE.DirectionalLight(0x38bdf8, 2.2);
    cyanRim.position.set(-4, 3, -4);
    scene.add(cyanRim);

    const violetRim = new THREE.DirectionalLight(0x818cf8, 1.5);
    violetRim.position.set(3, -4, -3);
    scene.add(violetRim);

    // =========================================================================
    // 3. REMORUS FLOATING HIERARCHY (NO GRAVITY - ZERO BOUNCE)
    // =========================================================================
    const remorusRoot = new THREE.Group();
    scene.add(remorusRoot);

    // =========================================================================
    // 4. PRISTINE TRANSLUCENT GLASS JELLY MATERIAL
    // =========================================================================
    // Clean, smooth, refractive glass jelly without cartoon eyes or mouth
    const jellyMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x38bdf8,
      roughness: 0.04,
      metalness: 0.02,
      transmission: 0.92,       // Optical glass transmission
      ior: 1.40,                // High refractive glass-jelly index
      transparent: true,
      opacity: 0.95,
      reflectivity: 0.85,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      depthWrite: false
    });

    // Outer subtle chromatic halo
    const haloMaterial = new THREE.MeshBasicMaterial({
      color: 0x7dd3fc,
      transparent: true,
      opacity: 0.14,
      blending: THREE.AdditiveBlending,
      side: THREE.BackSide
    });

    // Pristine Sphere Geometry (No cartoon features, smooth elegant geometry)
    const SPHERE_RADIUS = 1.42;
    const sphereGeo = new THREE.SphereGeometry(SPHERE_RADIUS, 64, 48);
    const jellySphere = new THREE.Mesh(sphereGeo, jellyMaterial);
    remorusRoot.add(jellySphere);

    const haloMesh = new THREE.Mesh(sphereGeo.clone(), haloMaterial);
    haloMesh.scale.set(1.035, 1.035, 1.035);
    remorusRoot.add(haloMesh);

    // =========================================================================
    // 5. INNER REMORUS NEURAL ENERGY CORE (Bioluminescent Pulse)
    // =========================================================================
    const coreGeo = new THREE.SphereGeometry(0.56, 32, 28);
    const coreMaterial = new THREE.MeshBasicMaterial({
      color: 0x0284c7,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending
    });
    const coreMesh = new THREE.Mesh(coreGeo, coreMaterial);
    remorusRoot.add(coreMesh);

    // Inner bioluminescent light
    const coreLight = new THREE.PointLight(0x38bdf8, 2.2, 5.0);
    coreMesh.add(coreLight);

    // Dual Energy Rings (Subtle orbiting orbital bands around the core)
    const ringGeo1 = new THREE.RingGeometry(0.78, 0.82, 48);
    const ringMat1 = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.45,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });
    const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
    ring1.rotation.x = Math.PI / 3;
    remorusRoot.add(ring1);

    const ringGeo2 = new THREE.RingGeometry(0.92, 0.95, 48);
    const ringMat2 = new THREE.MeshBasicMaterial({
      color: 0x818cf8,
      transparent: true,
      opacity: 0.35,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });
    const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
    ring2.rotation.y = Math.PI / 4;
    remorusRoot.add(ring2);

    // =========================================================================
    // 6. STATE & AMBIENT LEVITATION (WEIGHTLESS - ZERO GRAVITY)
    // =========================================================================
    let currentMode = "idle"; // "idle" | "listening" | "thinking" | "speaking"
    let targetJellyColor = new THREE.Color(0x38bdf8);
    let targetCoreColor = new THREE.Color(0x0284c7);
    let targetCoreIntensity = 2.0;
    let targetCorePulseRate = 2.0;

    // Smooth subtle mouse gaze (Sphere leans gracefully without jumping)
    let targetRotY = 0;
    let targetRotX = 0;

    // Window Drag State (Weightless smooth translation - NO gravity spring)
    window.onWindowMove = function() {
      // Pure weightless movement
    };
    window.onWindowStop = function() {
      // Zero gravity bounce
    };

    // Keyboard & Mouse reactivity (subtle ripple pulse)
    window.onUserKeyPress = function() {
      // Subtle gentle core energy spark
      targetCoreIntensity = Math.min(3.5, targetCoreIntensity + 0.1);
    };
    window.onUserMouseClick = function() {
      targetCoreIntensity = Math.min(3.5, targetCoreIntensity + 0.15);
    };

    // Gaze tracking
    window.setMousePos = function(normX, normY) {
      targetRotY = normX * 0.30;
      targetRotX = normY * 0.25;
    };

    // =========================================================================
    // 7. REMORUS AI INTERACTION MODES
    // =========================================================================
    window.setEmotion = function(mode) {
      currentMode = mode;

      switch(mode) {
        case "listening":
          // Vibrant cyan neon glow when hearing speech
          targetJellyColor.setHex(0x00f5ff);
          targetCoreColor.setHex(0x06b6d4);
          targetCoreIntensity = 3.6;
          targetCorePulseRate = 6.0;
          ringMat1.opacity = 0.85;
          ringMat2.opacity = 0.70;
          showPill("Listening... 🎙️", "listening");
          break;

        case "thinking":
          // High-energy golden / amber neural processing pulse
          targetJellyColor.setHex(0x38bdf8);
          targetCoreColor.setHex(0xfbbf24);
          targetCoreIntensity = 4.2;
          targetCorePulseRate = 8.5;
          ringMat1.opacity = 0.95;
          ringMat2.opacity = 0.80;
          showPill("Processing... 💭", "thinking");
          break;

        case "speaking":
        case "happy":
          // Harmonic azure / violet resonance
          targetJellyColor.setHex(0x38bdf8);
          targetCoreColor.setHex(0x6366f1);
          targetCoreIntensity = 3.0;
          targetCorePulseRate = 4.0;
          ringMat1.opacity = 0.65;
          ringMat2.opacity = 0.55;
          break;

        case "lookaway":
          // Muted stealth privacy mode
          targetJellyColor.setHex(0x475569);
          targetCoreColor.setHex(0x1e293b);
          targetCoreIntensity = 0.6;
          targetCorePulseRate = 1.0;
          ringMat1.opacity = 0.15;
          ringMat2.opacity = 0.10;
          showPill("Privacy Mode 🙈");
          break;

        default: // "idle"
          targetJellyColor.setHex(0x38bdf8);
          targetCoreColor.setHex(0x0284c7);
          targetCoreIntensity = 2.0;
          targetCorePulseRate = 2.0;
          ringMat1.opacity = 0.45;
          ringMat2.opacity = 0.35;
          break;
      }
    };

    function showPill(text, type = "") {
      remorusPill.textContent = text;
      remorusPill.className = "remorus-pill visible" + (type ? " " + type : "");
      clearTimeout(remorusPill._timer);
      remorusPill._timer = setTimeout(() => {
        remorusPill.classList.remove("visible");
      }, 3500);
    }

    // Direct Click to Speak Trigger
    container.addEventListener('pointerdown', (e) => {
      // Signal Python to toggle voice recording
      document.title = "remorus_trigger:mic";
    });

    window.triggerPoke = function() {
      // Subtle energetic shimmer
      targetCoreIntensity = 3.8;
    };
    window.petCat = function() {};
    window.setLookAway = function(state) {
      window.setEmotion(state ? "lookaway" : "idle");
    };

    // =========================================================================
    // 8. 60 FPS SERENE AMBIENT LEVITATION LOOP (WEIGHTLESS)
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const time = clock.getElapsedTime();

      // 1. Smooth Material & Lighting Transitions
      jellyMaterial.color.lerp(targetJellyColor, dt * 5.0);
      coreMaterial.color.lerp(targetCoreColor, dt * 5.0);
      coreLight.color.lerp(targetCoreColor, dt * 5.0);
      coreLight.intensity += (targetCoreIntensity - coreLight.intensity) * dt * 5.0;

      // 2. Smooth Gaze Rotation
      remorusRoot.rotation.y += (targetRotY - remorusRoot.rotation.y) * dt * 4.5;
      remorusRoot.rotation.x += (targetRotX - remorusRoot.rotation.x) * dt * 4.5;

      // 3. Gentle Pure Weightless Levitation (Zero Gravity, Zero Bounce)
      remorusRoot.position.y = Math.sin(time * 1.5) * 0.08;

      // 4. Subtle Ambient Respiration Scale
      const breathe = 1.0 + Math.sin(time * 2.0) * 0.022;
      jellySphere.scale.set(breathe, breathe, breathe);
      haloMesh.scale.set(breathe * 1.035, breathe * 1.035, breathe * 1.035);

      // 5. Orbital Energy Bands Rotation
      ring1.rotation.z += dt * 0.6;
      ring2.rotation.z -= dt * 0.45;

      // 6. Neural Core Harmonic Pulse
      const corePulse = 1.0 + Math.sin(time * targetCorePulseRate) * 0.12;
      coreMesh.scale.set(corePulse, corePulse, corePulse);

      renderer.render(scene, camera);
    }

    animate();

    // Window Resize Handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
